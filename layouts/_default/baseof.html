<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem("portfolio-theme") === "dark") {
            document.documentElement.dataset.theme = "dark";
          }
        } catch (_) {
          // Keep the first-visit light default when storage is unavailable.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="{{ site.Home.RelPermalink }}" aria-label="Linus portfolio home"><span class="wordmark-mark">L</span><span>LINUS / DEV</span></a>
      <nav aria-label="Primary navigation">
        <a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a>
        {{ with site.GetPage "/projects" }}<a href="{{ .RelPermalink }}"{{ if or (eq $.Section "projects") (eq $.Section "Exam Portfolio") }} aria-current="page"{{ end }}>Projects</a>{{ end }}
        {{ with site.GetPage "/about" }}<a href="{{ .RelPermalink }}"{{ if eq $.Section "about" }} aria-current="page"{{ end }}>About Me</a>{{ end }}
        <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
          <span class="theme-toggle-icon" aria-hidden="true">◐</span>
          <span class="theme-toggle-label">Dark</span>
        </button>
      </nav>
    </header>
    <main id="main">{{ block "main" . }}{{ end }}</main>
    <footer class="site-footer"><p>Linus · Software development portfolio</p><p class="system-label">Java / React / API design</p></footer>
    <script>
    window.difyChatbotConfig = {
      token: 'VlCSbRmcJE7EOUpv',
      baseUrl: 'https://udify.app',
      inputs: {},
      systemVariables: {},
      userVariables: {},
    }
  </script>

  <script
    src="https://udify.app/embed.min.js"
    id="VlCSbRmcJE7EOUpv"
    defer>
  </script>

  <script>
    (function () {
      var storageKey = "portfolio-theme";
      var root = document.documentElement;
      var toggle = document.querySelector(".theme-toggle");

      if (!toggle) return;

      function updateToggle(theme) {
        var isDark = theme === "dark";
        toggle.setAttribute("aria-pressed", String(isDark));
        toggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
        toggle.querySelector(".theme-toggle-label").textContent = isDark ? "Light" : "Dark";
      }

      updateToggle(root.dataset.theme);

      toggle.addEventListener("click", function () {
        var nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
        root.dataset.theme = nextTheme;
        updateToggle(nextTheme);

        try {
          localStorage.setItem(storageKey, nextTheme);
        } catch (_) {
          // The active page still changes theme when storage is unavailable.
        }
      });
    })();
  </script>

  <style>
    #dify-chatbot-bubble-button {
      background-color: #1C64F2 !important;
    }

    #dify-chatbot-bubble-window {
      width: 24rem !important;
      height: 40rem !important;
    }
  </style>
  </body>
</html>
